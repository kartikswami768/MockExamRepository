name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # Official Gradle image, pinned to the multi-platform digest for Gradle 8.9 + JDK 17.
  GRADLE_IMAGE: gradle:8.9-jdk17@sha256:682c0245826af1e6f5f7b95306cc7039d3d8d8e8de06b1a330e6f9015ee757a0

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle validation and dependency cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Pull pinned Gradle runtime image
        run: docker pull "$GRADLE_IMAGE"

      - name: Verify pinned Gradle runtime
        shell: bash
        run: |
          mkdir -p "$GRADLE_USER_HOME"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e GRADLE_USER_HOME=/gradle-cache \
            -v "$GRADLE_USER_HOME:/gradle-cache" \
            "$GRADLE_IMAGE" gradle --version

      - name: Run unit tests and build APK
        shell: bash
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e GRADLE_USER_HOME=/gradle-cache \
            -e ANDROID_HOME=/android-sdk \
            -e ANDROID_SDK_ROOT=/android-sdk \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$ANDROID_HOME:/android-sdk:ro" \
            -v "$GRADLE_USER_HOME:/gradle-cache" \
            -w /workspace \
            "$GRADLE_IMAGE" \
            gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Verify APK output
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mockexam-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
