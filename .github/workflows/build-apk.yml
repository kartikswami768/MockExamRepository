name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        shell: bash
        run: |
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
            https://downloads.gradle.org/distributions/gradle-8.9-bin.zip \
            --output "$RUNNER_TEMP/gradle-8.9-bin.zip"
          sudo unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"
          /opt/gradle-8.9/bin/gradle --version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mockexam-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
